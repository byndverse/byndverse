<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Signature – Jay Salton</title>
</head>
<body style="margin:0;padding:20px;background:#f4f4f4;font-family:Arial,sans-serif;">

  <!-- SIGNATURE START — copy everything inside this table -->
  <table cellpadding="0" cellspacing="0" border="0"
         style="max-width:480px;border-collapse:collapse;background:#ffffff;
                border-left:4px solid #7c3aed;font-family:Arial,Helvetica,sans-serif;">
    <tr>
      <td style="padding:20px 24px 16px;">

        <!-- Name & title -->
        <table cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td>
              <p style="margin:0 0 2px;font-size:18px;font-weight:700;
                         color:#1a1a2e;letter-spacing:0.3px;">Jay Salton</p>
              <p style="margin:0 0 2px;font-size:13px;font-weight:600;
                         color:#7c3aed;text-transform:uppercase;letter-spacing:1px;">Artist</p>
              <p style="margin:0;font-size:13px;color:#555555;">Beyondverse</p>
            </td>
          </tr>
        </table>

        <!-- Divider -->
        <table cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:14px 0;">
          <tr>
            <td style="height:1px;background:linear-gradient(to right,#7c3aed,transparent);
                        font-size:0;line-height:0;">&nbsp;</td>
          </tr>
        </table>

        <!-- Contact details -->
        <table cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td style="padding-bottom:6px;vertical-align:middle;">
              <!-- Phone icon -->
              <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/phone.svg"
                   width="13" height="13" alt=""
                   style="vertical-align:middle;margin-right:6px;opacity:0.5;" />
              <span style="font-size:13px;color:#444444;vertical-align:middle;">
                0433 252 160
              </span>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:6px;vertical-align:middle;">
              <a href="https://byndverse.io" target="_blank"
                 style="text-decoration:none;color:#7c3aed;font-size:13px;
                         font-weight:600;vertical-align:middle;">
                🌐&nbsp;byndverse.io
              </a>
            </td>
          </tr>
        </table>

        <!-- Social icons -->
        <table cellpadding="0" cellspacing="0" border="0" style="margin-top:12px;">
          <tr>
            <!-- Instagram -->
            <td style="padding-right:10px;">
              <a href="https://instagram.com/beluxbeyond" target="_blank"
                 style="display:inline-block;width:32px;height:32px;border-radius:8px;
                         background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4);
                         text-align:center;line-height:32px;text-decoration:none;">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/instagram.svg"
                     width="16" height="16" alt="Instagram"
                     style="vertical-align:middle;filter:invert(1);margin-top:8px;" />
              </a>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
  <!-- SIGNATURE END -->

</body>
</html>
